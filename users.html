<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALB Users</title><style>
body{background:#101820;color:#fff;font-family:Arial;padding:20px}h1{text-align:center}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}.card{background:#1c2633;padding:20px;border-radius:12px}input,select{width:100%;padding:10px;margin:8px 0}button{padding:10px 14px;margin:4px}
</style></head><body><h1>🚿 ALB USERS MANAGER</h1><div class="grid"><div class="card"><h2>Users</h2><input id="search" placeholder="Телефон"><div id="users">Загрузка...</div></div><div class="card"><h2>Настройки</h2><input id="name" placeholder="Имя"><input id="phone" placeholder="Телефон"><select id="music"><option value="">No music</option><option>Track 1</option><option>Track 2</option></select><p>Цвет: <span id="currentColor">off</span></p><button onclick="setColor('blue')">🔵 Blue</button><button onclick="setColor('red')">🔴 Red</button><button onclick="setColor('green')">🟢 Green</button><br><label><input id="relay1" type="checkbox"> Relay1</label><br><label><input id="relay2" type="checkbox"> Relay2</label><br><label><input id="vip" type="checkbox"> VIP</label><br><button onclick="saveUser()">💾 Save</button></div></div><script>
let selectedColor='off';
function setColor(c){selectedColor=c;currentColor.textContent=c;}
async function loadUsers(){try{const r=await fetch('/api/users');const d=await r.json();users.innerHTML='';const arr=d.users?d.users:Object.values(d);if(!arr.length){users.innerHTML='Нет пользователей';return;}arr.forEach(u=>{const x=document.createElement('div');x.textContent='📞 '+u.phone;x.style.cursor='pointer';x.onclick=()=>{name.value=u.name||'';phone.value=u.phone||'';music.value=u.music||'';relay1.checked=!!u.relay1;relay2.checked=!!u.relay2;vip.checked=!!u.vip;selectedColor=u.color||'off';currentColor.textContent=selectedColor;};users.appendChild(x);});}catch(e){users.textContent='Ошибка';}}
async function saveUser(){const body={phone:phone.value,name:name.value,music:music.value,color:selectedColor,relay1:relay1.checked,relay2:relay2.checked,vip:vip.checked};await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert('Saved');loadUsers();}
loadUsers();
</script></body></html>
