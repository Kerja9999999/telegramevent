<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALB Users</title>

<style>
body{

</head>

<div>

    style="

</div>

</div>

<div class="grid">

<div class="card">

<h2>Users</h2>

<input id="search" placeholder="Телефон">

<div id="users">
Загрузка...

</div>

<option value="sky">🩵 Sky</option>

<option value="yellow">🟡 Yellow</option>
<option value="gold">👑 Gold</option>

</select>

<p>
Current:
<b id="currentColor">off</b>
</p>

<br>

<label>
<input id="relay1" type="checkbox">
Relay1
</label>

<br>

<label>
<input id="relay2" type="checkbox">
Relay2
</label>

<br>

<label>
<input id="vip" type="checkbox">
VIP
</label>

<br>

<button onclick="saveUser()">💾 Save</button>
<hr style="margin:20px 0;">


</div>

</div>

<script>

let selectedColor = "off";

function setColor(color){
    selectedColor = color;
    currentColor.textContent = color;
}

async function loadUsers(){

    try{

        const r = await fetch("/api/users");

        if(!r.ok){
            alert("Ошибка загрузки пользователей");
            return;
        }

        const d = await r.json();

        users.innerHTML = "";

        const arr = d.users ? d.users : Object.values(d);

        if(arr.length === 0){
            users.innerHTML = "Нет пользователей";
            return;
        }

        arr.forEach(u=>{

            const row = document.createElement("div");
            row.className = "userRow";

            const phoneDiv = document.createElement("div");
            phoneDiv.className = "userPhone";

            phoneDiv.innerHTML =
                "📞 " + u.phone +
                (u.name ? "<br><small>"+u.name+"</small>" : "");

            phoneDiv.onclick = ()=>{

                name.value = u.name || "";
                phone.value = u.phone || "";
                music.value = u.music || "";

                relay1.checked = !!u.relay1;
                relay2.checked = !!u.relay2;
                vip.checked = !!u.vip;

                selectedColor = u.color || "off";
                currentColor.textContent = selectedColor;

            };

            const del = document.createElement("button");

            del.className = "deleteBtn";
            del.innerHTML = "🗑";

            del.onclick = async(e)=>{

                e.stopPropagation();

                if(!confirm("Удалить пользователя?"))
                    return;

                const r = await fetch("/api/users/" + encodeURIComponent(u.phone),{
                    method:"DELETE"
                });

                const ans = await r.json();

                if(ans.ok){
                    loadUsers();
                }else{
                    alert(ans.message || "Ошибка");
                }

            };

            row.appendChild(phoneDiv);
            row.appendChild(del);

            users.appendChild(row);

        });

    }catch(err){

        console.error(err);

        users.innerHTML = "Ошибка";

    }

}

async function saveUser(){

    const body = {

        phone: phone.value,
        name: name.value,
        music: music.value,
        color: selectedColor,
        relay1: relay1.checked,
        relay2: relay2.checked,
        vip: vip.checked

    };

    const r = await fetch("/api/users",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(body)

    });

    if(r.ok){

        alert("Saved");

        loadUsers();

    }else{

        alert("Ошибка сохранения");

    }

}

loadUsers();
    function openControl(){

    window.location="/control";

}
function logout(){

    if(!confirm("Выйти из админки?"))
        return;

    fetch("/users",{
        headers:{
            Authorization:"Basic logout:logout"
        }
    }).finally(()=>{

        alert("Закройте браузер или вкладку, чтобы полностью выйти из Basic Auth.");

        location.reload();

    });

}
</script>

</body>
</html>
