<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALB CarWash Control</title>
<style>
body{background:#101820;color:#fff;font-family:Arial;margin:0;padding:20px;text-align:center}
h1{margin:10px 0 30px}
.card{background:#1c2633;border-radius:14px;padding:20px;margin:20px auto;max-width:900px}
button{width:180px;height:55px;border:none;border-radius:10px;margin:8px;font-size:18px;font-weight:bold;cursor:pointer}
.red{background:#f44336;color:#fff}
.green{background:#4CAF50;color:#fff}
.blue{background:#2196F3;color:#fff}
.yellow{background:#FFD600;color:#000}
.purple{background:#9C27B0;color:#fff}
.white{background:#fff;color:#000}
.rainbow{background:linear-gradient(90deg,red,orange,yellow,green,blue,purple);color:#fff}
.status{font-size:20px;line-height:1.8}
</style>
</head>
<body>

<h1>🚿 ALB CARWASH CONTROL</h1>

<div class="card">
<h2>💡 LIGHT</h2>

<button class="red" onclick="setColor('red')">🔴 RED</button>
<button class="green" onclick="setColor('green')">🟢 GREEN</button>
<button class="blue" onclick="setColor('blue')">🔵 BLUE</button><br>

<button class="yellow" onclick="setColor('yellow')">🟡 YELLOW</button>
<button class="purple" onclick="setColor('purple')">🟣 PURPLE</button>
<button class="white" onclick="setColor('white')">⚪ WHITE</button><br>

<button class="rainbow" onclick="setColor('rainbow')">🌈 RAINBOW</button>
</div>

<div class="card">
<h2>🎵 MUSIC</h2>
<button class="green" onclick="musicOn()">▶ PLAY</button>
<button class="red" onclick="musicOff()">⏹ STOP</button>
</div>

<div class="card">
<h2>🧪 TESTS</h2>
<button onclick="runTest('/test/coin')">
🪙 COIN
</button>

<button onclick="runTest('/test/boris')">
💳 CARD
</button>

<button onclick="runTest('/test/wash')">
🚿 FULL WASH
</button>
</div>

<div class="card">
<h2>📊 LAST WASH</h2>
<div id="status" class="status">Loading...</div>
</div>

<script>
 async function runTest(url){

    try{

        const r = await fetch(url);

        const j = await r.json();

        console.log(j);

    }catch(e){

        alert("Test error");

    }

}
async function send(data){
 await fetch("/api/control",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(data)
 });
}
function setColor(c){
 send({light:true,color:c});
}
function musicOn(){
 send({music:true});
}
function musicOff(){
 send({music:false});
}
async function loadStatus(){

    try{

        const r = await fetch("/automation/status");
        const j = await r.json();

        let time = "-";

        if(j.time){

            const d = new Date(j.time);

            // Латвийское время
            time = d.toLocaleString("lv-LV",{
                timeZone:"Europe/Riga",
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            });

        }

        document.getElementById("status").innerHTML=`
👤 ${j.user||"-"}<br>
💶 ${j.amount||"-"}<br><br>

💦 Water: ${j.water||0} сек<br>
🫧 Foam: ${j.foam||0} сек<br>
✨ Wax: ${j.coat||0} сек<br><br>

🎵 Music: ${j.music||"-"}<br>
💡 Light: ${j.light||"-"}<br><br>

🕒 ${time}
`;

    }catch(e){

        console.log(e);

    }

}
loadStatus();
setInterval(loadStatus,2000);
</script>

</body>
</html>
