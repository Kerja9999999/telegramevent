<script>
 let coinProfile = {
    color: "off",
    music: "",
    relay1: false,
    relay2: false
};
 async function runTest(url){

    try{

        const r = await fetch(url);

        const j = await r.json();

        console.log(j);

    }catch(e){

        alert("Test error");

    }

}
async function send(data){
 await fetch("/api/control",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(data)
 });
}
function setColor(c){

    coinProfile.color = c;

    send({
        light:true,
        color:c
    });

    console.log(coinProfile);

}

function selectMusic(){

    const track = document.getElementById("musicSelect").value;

    coinProfile.music = track;

    send({
        music: track !== "",
        track: track
    });

    console.log(coinProfile);

}
async function loadStatus(){

    try{

        const r = await fetch("/automation/status");
        const j = await r.json();

        let time = "-";

        if(j.time){

            const d = new Date(j.time);

            // Латвийское время
            time = d.toLocaleString("lv-LV",{
                timeZone:"Europe/Riga",
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            });

        }

        document.getElementById("status").innerHTML=`
👤 ${j.user||"-"}<br>
💶 ${j.amount||"-"}<br><br>

💦 Water: ${j.water||0} сек<br>
🫧 Foam: ${j.foam||0} сек<br>
✨ Wax: ${j.coat||0} сек<br><br>

🎵 Music: ${j.music||"-"}<br>
💡 Light: ${j.light||"-"}<br><br>

🕒 ${time}
`;

    }catch(e){

        console.log(e);

    }

}
 loadCoinProfile();
loadStatus();
setInterval(loadStatus,2000);
 function logout(){

    if(!confirm("Выйти из админки?"))
        return;

    fetch("/users",{
        headers:{
            Authorization:"Basic logout:logout"
        }
    }).finally(()=>{

        location.href="/users";

    });

}
async function saveCoin(){

    console.log("Saving:", coinProfile);

    const r = await fetch("/api/coin",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(coinProfile)
    });

    const t = await r.text();
    console.log(t);
    alert("Saved");
}

async function loadCoinProfile(){

    const r = await fetch("/api/coin");
    const p = await r.json();

    coinProfile = p;

    document.getElementById("musicSelect").value =
        coinProfile.music || "";

    console.log("Coin profile loaded:", coinProfile);

}
