<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALB Admin Login</title>

<style>
body{
    margin:0;
    background:#101820;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}
.box{
    background:#1c2633;
    padding:30px;
    border-radius:12px;
    width:320px;
}
h2{
    color:white;
    text-align:center;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#0056b3;
}
#error{
    color:#ff6666;
    text-align:center;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 ALB Admin</h2>

<input id="login" placeholder="Login">

<input id="password" type="password" placeholder="Password">

<button onclick="doLogin()">
Login
</button>

<div id="error"></div>

</div>

<script>

async function doLogin(){

    const r=await fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            login:login.value,
            password:password.value

        })

    });

    if(r.ok){

        location="/users";

    }else{

        error.innerText="Неверный логин или пароль";

    }

}

</script>

</body>
</html>
